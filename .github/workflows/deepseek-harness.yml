name: DeepSeek Harness

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

concurrency:
  group: deepseek-harness
  cancel-in-progress: false

permissions:
  contents: write

env:
  OPENROUTER_BASE_URL: https://openrouter.ai/api/v1
  OPENROUTER_MODEL: nvidia/nemotron-3-ultra-550b-a55b:free
  CLOUDFLARE_HOSTNAME: dsh.example.com

jobs:
  deepseek-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Install DeepSeek Harness
        run: npm install -g @deepseek-ai/dsh

      - name: Verify dsh and pnpm
        run: |
          dsh --version || true
          pnpm --version

      - name: Install dsh-full-remote
        run: |
          dsh plugin --profile web add github:JUANWANG-BUAA/dsh-full-remote

      - name: Configure Git for Harness commits
        run: |
          git config user.name "DeepSeek Harness Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare content directory
        run: mkdir -p content

      - name: Start DeepSeek Harness with remote profile
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          mkdir -p ~/.deepseek-harness
          nohup dsh --profile web > /tmp/dsh.log 2>&1 &
          echo $! > /tmp/dsh.pid

      - name: Wait for DeepSeek Harness
        run: |
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3080/ >/dev/null 2>&1; then
              echo "DeepSeek Harness is ready"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "DeepSeek Harness failed to start"
              cat /tmp/dsh.log || true
              exit 1
            fi
            sleep 5
          done

      - name: Start dsh-full-remote proxy
        run: |
          echo "dsh-full-remote installed in the web profile."
          echo "Check /tmp/dsh.log for the profile startup output."

      - name: Install cloudflared
        run: |
          curl -fsSL --retry 5 --retry-delay 2 \
            -o /tmp/cloudflared.deb \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i /tmp/cloudflared.deb
          cloudflared --version

      - name: Start fixed Cloudflare Tunnel
        env:
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_TUNNEL_TOKEN"
          printf '%s' "$CLOUDFLARE_TUNNEL_TOKEN" > /tmp/cloudflared-token
          chmod 600 /tmp/cloudflared-token

          nohup cloudflared tunnel run \
            --token-file /tmp/cloudflared-token \
            > /tmp/cloudflared.log 2>&1 &
          echo $! > /tmp/cloudflared.pid

          sleep 5
          cat /tmp/cloudflared.log || true

      - name: Verify fixed hostname
        run: |
          echo "Expected fixed hostname: https://${CLOUDFLARE_HOSTNAME}/"
          echo "Cloudflare Tunnel is managed by the Dashboard; this workflow does not run cloudflared login."
          echo "Check /tmp/cloudflared.log if the connector is not online."

      - name: Show access information
        run: |
          echo "=============================================="
          echo "DeepSeek Harness is running"
          echo "Cloudflare hostname: https://${CLOUDFLARE_HOSTNAME}/"
          echo "Model: ${OPENROUTER_MODEL}"
          echo "Provider: OpenRouter"
          echo "Blog content directory: ${GITHUB_WORKSPACE}/content"
          echo "Run ID: ${{ github.run_id }}"
          echo "=============================================="

      - name: Keep alive for 5 hours
        run: sleep 5h

      - name: Commit Markdown created by Harness
        run: |
          git add content/
          if git diff --cached --quiet; then
            echo "No new blog content to commit."
            exit 0
          fi
          git commit -m "Publish blog posts from DeepSeek Harness"
          git push origin HEAD:main

      - name: Cleanup
        if: always()
        run: |
          if [ -f /tmp/cloudflared.pid ]; then
            kill "$(cat /tmp/cloudflared.pid)" 2>/dev/null || true
          fi
          rm -f /tmp/cloudflared-token

      - name: Show logs
        if: always()
        run: |
          echo "===== DeepSeek Harness ====="
          cat /tmp/dsh.log || true
          echo "===== Cloudflare Tunnel ====="
          cat /tmp/cloudflared.log || true

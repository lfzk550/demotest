name: DeepSeek Harness

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

# Required repository secrets:
#   GROK_API_KEY              primary key for https://api.picpi.top/v1
#   OPENROUTER_API_KEY        fallback key for OpenRouter
#   CLOUDFLARE_TUNNEL_TOKEN   Cloudflare tunnel token
env:
  GROK_BASE_URL: https://api.picpi.top/v1
  GROK_MODEL: grok-4.6
  OPENROUTER_BASE_URL: https://openrouter.ai/api/v1
  OPENROUTER_MODEL: 'nvidia/nemotron-3-ultra-550b-a55b:free'
  CLOUDFLARE_HOSTNAME: dsh.ap2.ccwu.cc
  NODE_VERSION: '24.11.1'
  PNPM_VERSION: '10.26.0'

jobs:
  deepseek-harness:
    name: DeepSeek Harness
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Node.js 24 system-wide
        shell: bash
        run: |
          set -euxo pipefail
          curl -fsSL https://deb.nodesource.com/setup_24.x | sudo -E bash -
          sudo apt-get install -y nodejs
          hash -r
          node --version
          npm --version
          command -v node
          readlink -f "$(command -v node)"

      - name: Install pnpm 10.26.0 with Node 24
        shell: bash
        run: |
          set -euxo pipefail
          npm install --global "pnpm@${PNPM_VERSION}"
          hash -r
          pnpm --version
          node --version
          command -v pnpm

      - name: Verify Node runtime
        shell: bash
        run: |
          set -euxo pipefail
          echo "PATH=$PATH"
          echo "node=$(command -v node)"
          echo "npm=$(command -v npm)"
          echo "pnpm=$(command -v pnpm)"
          node --version
          npm exec -- node --version

      - name: Install DeepSeek Harness
        run: npm install -g @deepseek-ai/dsh

      - name: Verify dsh and pnpm
        run: |
          node --version
          dsh --version
          pnpm --version

      - name: Configure Git for Harness commits
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "DeepSeek Harness Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

      - name: Prepare content directory
        run: mkdir -p content

      - name: Configure Grok primary and OpenRouter fallback
        env:
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          bash .github/scripts/configure-dsh-providers.sh grok

      - name: Verify DSH configuration
        env:
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          dsh --profile web --dump-config > /tmp/dsh-config.txt
          grep -n -E 'grok|openrouter|GROK_API_KEY|OPENROUTER_API_KEY|grok-4.6|nemotron-3-ultra-550b-a55b|api.picpi.top' /tmp/dsh-config.txt || true

      - name: Start DeepSeek Harness web profile
        env:
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          nohup dsh --profile web --host 127.0.0.1 --port 3080 --trusted-host dsh.ap2.ccwu.cc --no-open > /tmp/dsh.log 2>&1 &
          echo $! > /tmp/dsh.pid

      - name: Wait for DeepSeek Harness
        shell: bash
        run: |
          set -u
          for i in {1..60}; do
            if curl -fsS --connect-timeout 3 --max-time 5 http://127.0.0.1:3080/ >/dev/null 2>&1; then
              echo "DeepSeek Harness is ready on 127.0.0.1:3080"
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/dsh.pid)" 2>/dev/null; then
              echo "DeepSeek Harness process exited"
              cat /tmp/dsh.log || true
              exit 1
            fi
            sleep 5
          done
          echo "DeepSeek Harness failed to become ready"
          cat /tmp/dsh.log || true
          exit 1

      - name: Install cloudflared
        shell: bash
        run: |
          set -euxo pipefail
          curl -fsSL --retry 5 --retry-delay 2 \
            -o /tmp/cloudflared.deb \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i /tmp/cloudflared.deb
          cloudflared --version

      - name: Start fixed Cloudflare Tunnel
        env:
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
        run: |
          set -euxo pipefail
          test -n "$CLOUDFLARE_TUNNEL_TOKEN"
          printf '%s' "$CLOUDFLARE_TUNNEL_TOKEN" > /tmp/cloudflared-token
          chmod 600 /tmp/cloudflared-token

          nohup cloudflared tunnel run \
            --token-file /tmp/cloudflared-token \
            > /tmp/cloudflared.log 2>&1 &
          echo $! > /tmp/cloudflared.pid
          sleep 5

          if ! kill -0 "$(cat /tmp/cloudflared.pid)" 2>/dev/null; then
            echo "cloudflared exited immediately"
            cat /tmp/cloudflared.log || true
            exit 1
          fi

          cat /tmp/cloudflared.log || true

      - name: Verify Cloudflare Tunnel and public HTTPS endpoint
        shell: bash
        run: |
          set -u
          url="https://${CLOUDFLARE_HOSTNAME}/"
          echo "Checking public endpoint: ${url}"
          echo "Expected origin: http://127.0.0.1:3080"

          if ! curl -fsS --connect-timeout 5 --max-time 10 \
            http://127.0.0.1:3080/ \
            -o /tmp/local-dsh-response; then
            echo "Local DeepSeek Harness health check failed"
            cat /tmp/dsh.log || true
            exit 1
          fi
          echo "Local DSH endpoint: OK"

          last_status=""
          last_error=""
          for i in {1..30}; do
            if ! kill -0 "$(cat /tmp/cloudflared.pid)" 2>/dev/null; then
              echo "cloudflared stopped before public endpoint became reachable"
              cat /tmp/cloudflared.log || true
              exit 1
            fi

            rm -f /tmp/public-response /tmp/public-curl-error
            status="$(curl -sS \
              --connect-timeout 10 \
              --max-time 20 \
              -o /tmp/public-response \
              -w '%{http_code}' \
              "$url" 2>/tmp/public-curl-error || true)"
            error="$(cat /tmp/public-curl-error 2>/dev/null || true)"
            last_status="$status"
            last_error="$error"

            echo "Public check ${i}/30: HTTP ${status:-curl-failed}"
            if [ -s /tmp/public-response ]; then
              head -c 500 /tmp/public-response || true
              echo
            fi

            case "$status" in
              2??|3??|401|403)
                echo "Cloudflare public endpoint is reachable: ${url}"
                echo "HTTP ${status} is acceptable for this connectivity check."
                exit 0
                ;;
            esac

            sleep 5
          done

          echo "Public HTTPS endpoint is NOT reachable after 30 attempts."
          echo "Last HTTP status: ${last_status:-none}"
          echo "Last curl error: ${last_error:-none}"
          echo "===== cloudflared log ====="
          cat /tmp/cloudflared.log || true
          echo "===== local DSH log ====="
          cat /tmp/dsh.log || true
          exit 1

      - name: Show access information
        run: |
          echo "=============================================="
          echo "DeepSeek Harness is running"
          echo "Cloudflare hostname: https://${CLOUDFLARE_HOSTNAME}/"
          echo "Tunnel target: http://127.0.0.1:3080"
          echo "DSH trusted host: ${CLOUDFLARE_HOSTNAME}"
          echo "Primary provider: grok"
          echo "Primary model: ${GROK_MODEL}"
          echo "Primary API: ${GROK_BASE_URL}"
          echo "Fallback provider: openrouter"
          echo "Fallback model: ${OPENROUTER_MODEL}"
          echo "Blog content directory: ${GITHUB_WORKSPACE}/content"
          echo "Node: $(node --version)"
          echo "pnpm: $(pnpm --version)"
          echo "Run ID: ${{ github.run_id }}"
          echo "Authentication: handled by Cloudflare Access (if configured)"
          echo "=============================================="

      - name: Keep alive for 5 hours
        run: sleep 5h

      - name: Commit Markdown created by Harness
        run: |
          git add content/
          if git diff --cached --quiet; then
            echo "No new blog content to commit."
            exit 0
          fi
          git commit -m "Publish blog posts from DeepSeek Harness"
          git push origin HEAD:main

      - name: Cleanup
        if: always()
        run: |
          if [ -f /tmp/cloudflared.pid ]; then
            kill "$(cat /tmp/cloudflared.pid)" 2>/dev/null || true
          fi
          if [ -f /tmp/dsh.pid ]; then
            kill "$(cat /tmp/dsh.pid)" 2>/dev/null || true
          fi
          rm -f /tmp/cloudflared-token

      - name: Show logs
        if: always()
        run: |
          echo "===== DeepSeek Harness ====="
          cat /tmp/dsh.log || true
          echo "===== Cloudflare Tunnel ====="
          cat /tmp/cloudflared.log || true

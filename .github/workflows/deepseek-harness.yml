name: DeepSeek Harness

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

env:
  OPENROUTER_BASE_URL: https://openrouter.ai/api/v1
  OPENROUTER_MODEL: nvidia/nemotron-3-ultra-550b-a55b:free

jobs:
  deepseek-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: Checkout blog repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install DeepSeek Harness
        run: npm install -g @deepseek-ai/dsh

      - name: Configure Git for Harness commits
        run: |
          git config user.name "DeepSeek Harness Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare content directory
        run: mkdir -p content

      - name: Install Tailscale
        run: curl -fsSL https://tailscale.com/install.sh | sh

      - name: Enable IP Forward
        run: sudo sysctl -w net.ipv4.ip_forward=1

      - name: Setup NAT
        run: sudo iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE

      - name: Start Tailscale
        run: |
          sudo tailscale up \
            --authkey="${{ secrets.TS_KEY }}" \
            --hostname="deepseek-harness-${{ github.run_id }}"

      - name: Start DeepSeek Harness
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          mkdir -p ~/.deepseek-harness
          cat > ~/.deepseek-harness/settings.yaml <<'EOF'
          providers:
            openrouter:
              apiKey: ${OPENROUTER_API_KEY}
              baseURL: https://openrouter.ai/api/v1
              models:
                - id: nvidia/nemotron-3-ultra-550b-a55b:free
                  name: NVIDIA Nemotron 3 Ultra (free)
                  protocol: openai-completions
                  reasoning: true
                  contextWindow: 1000000
                  maxTokens: 65536
          defaultModel: openrouter/nvidia/nemotron-3-ultra-550b-a55b:free
          EOF

          nohup dsh web --host 0.0.0.0 --port 3080 --no-open > /tmp/dsh.log 2>&1 &
          echo $! > /tmp/dsh.pid

      - name: Wait for DeepSeek Harness
        run: |
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3080/ >/dev/null 2>&1; then
              echo "DeepSeek Harness is ready"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "DeepSeek Harness failed to start"
              cat /tmp/dsh.log || true
              exit 1
            fi
            sleep 5
          done

      - name: Show access information
        run: |
          IP=$(tailscale ip -4 | head -n1)
          echo "=============================================="
          echo "DeepSeek Harness is running"
          echo "Web UI: http://${IP}:3080"
          echo "Tailscale IP: ${IP}"
          echo "Model: ${OPENROUTER_MODEL}"
          echo "Provider: OpenRouter"
          echo "Blog content directory: ${GITHUB_WORKSPACE}/content"
          echo "Run ID: ${{ github.run_id }}"
          echo "=============================================="

      - name: Keep alive
        run: sleep 5h45m

      - name: Commit any Markdown created by Harness
        run: |
          git add content/
          if git diff --cached --quiet; then
            echo "No new blog content to commit."
            exit 0
          fi
          git commit -m "Publish blog posts from DeepSeek Harness"
          git push origin HEAD:main

      - name: Show logs
        if: always()
        run: cat /tmp/dsh.log || true

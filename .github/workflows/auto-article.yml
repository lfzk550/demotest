name: Auto Publish Article

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *'

permissions:
  contents: write

env:
  GROK_BASE_URL: https://api.picpi.top/v1
  GROK_MODEL: grok-4.6
  OPENROUTER_BASE_URL: https://openrouter.ai/api/v1
  OPENROUTER_MODEL: 'nvidia/nemotron-3-ultra-550b-a55b:free'
  OPENROUTER_MINIMAX_MODEL: 'minimax/minimax-m3:free'
  AGNES_BASE_URL: https://apihub.agnes-ai.com/v1
  AGNES_MODEL: agnes-2.5-flash
  ARTICLE_DIR: content

jobs:
  auto-article:
    name: Generate and publish article
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate article prompt
        env:
          ARTICLE_PROMPT: ${{ vars.ARTICLE_PROMPT }}
        run: |
          set -euo pipefail
          if [ -z "${ARTICLE_PROMPT//[[:space:]]/}" ]; then
            echo "ARTICLE_PROMPT is not configured"
            exit 1
          fi

      - name: Install Node.js
        run: |
          set -euxo pipefail
          curl -fsSL https://deb.nodesource.com/setup_22.x | sudo -E bash -
          sudo apt-get install -y nodejs
          node --version

      - name: Install DeepSeek Harness
        run: npm install -g @deepseek-ai/dsh

      - name: Configure Grok primary, OpenRouter fallback, and Agnes fallback
        env:
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
        run: |
          set -euo pipefail
          bash .github/scripts/configure-dsh-providers.sh grok

      - name: Generate article with Grok, OpenRouter, and Agnes fallbacks
        env:
          ARTICLE_PROMPT: ${{ vars.ARTICLE_PROMPT }}
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "${ARTICLE_DIR}"
          rm -f /tmp/article-output.md /tmp/article-error.log

          printf '%s\n' \
            'You are an autonomous article writing agent.' \
            '' \
            'User requirement:' \
            "${ARTICLE_PROMPT}" \
            '' \
            'Rules:' \
            '1. Use web_search to collect the latest information before writing.' \
            '2. Cross-check important facts and do not invent current offers.' \
            '3. Write exactly ONE complete Markdown article.' \
            '4. Output ONLY the article Markdown text. Do not output commentary, code fences, progress messages, tool logs, or explanations outside the article.' \
            '5. The workflow will save your output into content/ and handle Git commit/push.' \
            '6. Do not run git commit, git push, or any other Git write operation.' \
            > /tmp/article-task.txt

          if dsh --profile headless "$(cat /tmp/article-task.txt)" > /tmp/article-output.md 2>/tmp/article-error.log; then
            echo "Article generated with Grok primary model (${GROK_MODEL})"
          else
            echo "Grok failed; retrying with OpenRouter fallback (${OPENROUTER_MODEL})"
            cat /tmp/article-error.log >&2 || true
            bash .github/scripts/configure-dsh-providers.sh openrouter

            if dsh --profile headless "$(cat /tmp/article-task.txt)" > /tmp/article-output.md 2>/tmp/article-error.log; then
              echo "Article generated with OpenRouter fallback (${OPENROUTER_MODEL})"
            else
              echo "OpenRouter failed; retrying with Agnes fallback (${AGNES_MODEL})"
              cat /tmp/article-error.log >&2 || true
              bash .github/scripts/configure-dsh-providers.sh agnes
              dsh --profile headless "$(cat /tmp/article-task.txt)" > /tmp/article-output.md 2>/tmp/article-error.log
              echo "Article generated with Agnes fallback (${AGNES_MODEL})"
            fi
          fi

          if [ ! -s /tmp/article-output.md ]; then
            echo "DSH returned empty article output"
            cat /tmp/article-error.log >&2 || true
            exit 1
          fi

          sed -i '/^[[:space:]]*```[[:space:]]*markdown[[:space:]]*$/d; /^[[:space:]]*```[[:space:]]*$/d' /tmp/article-output.md

          ARTICLE_FILE="${ARTICLE_DIR}/$(date -u +%Y-%m-%d)-ai-freebies.md"
          mv /tmp/article-output.md "$ARTICLE_FILE"
          echo "ARTICLE_FILE=$ARTICLE_FILE"
          echo "Article size: $(wc -c < "$ARTICLE_FILE") bytes"

      - name: Validate article
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(content/*.md)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No article generated"
            exit 1
          fi
          for file in "${files[@]}"; do
            if [ ! -s "$file" ]; then
              echo "Empty article: $file"
              exit 1
            fi
          done
          echo "Generated article files:"
          ls -lh content/
          echo "Preview:"
          sed -n '1,12p' "${files[0]}"

      - name: Commit and push article
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "Article Publishing Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git add content/

          if git diff --cached --quiet; then
            echo "No new article changes to commit."
          else
            git commit -m "Publish automated article"
          fi

          git push origin HEAD:main

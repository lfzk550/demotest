name: Auto Publish Article

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *'

permissions:
  contents: write

env:
  OPENROUTER_BASE_URL: https://openrouter.ai/api/v1
  OPENROUTER_MODEL: 'nvidia/nemotron-3-ultra-550b-a55b:free'
  NODE_VERSION: '24.11.1'
  PNPM_VERSION: '10.26.0'
  ARTICLE_DIR: content

jobs:
  auto-article:
    name: Generate and publish article
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate article prompt
        env:
          ARTICLE_PROMPT: ${{ vars.ARTICLE_PROMPT }}
        run: |
          set -euo pipefail
          if [ -z "${ARTICLE_PROMPT//[[:space:]]/}" ]; then
            echo 'Repository variable ARTICLE_PROMPT is not configured.'
            echo 'Set it in Settings -> Secrets and variables -> Actions -> Variables.'
            exit 1
          fi

      - name: Install Node.js 24 system-wide
        shell: bash
        run: |
          set -euxo pipefail
          curl -fsSL https://deb.nodesource.com/setup_24.x | sudo -E bash -
          sudo apt-get install -y nodejs
          hash -r
          node --version
          npm --version
          command -v node
          readlink -f "$(command -v node)"

      - name: Install pnpm 10.26.0 with Node 24
        shell: bash
        run: |
          set -euxo pipefail
          npm install --global "pnpm@${PNPM_VERSION}"
          hash -r
          pnpm --version
          node --version
          command -v pnpm

      - name: Install DeepSeek Harness
        run: npm install -g @deepseek-ai/dsh

      - name: Verify DSH
        run: |
          set -euxo pipefail
          node --version
          dsh --version
          pnpm --version

      - name: Configure DSH OpenRouter provider
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euxo pipefail
          test -n "$OPENROUTER_API_KEY"

          DSH_HOME="${HOME}/.dsh"
          mkdir -p "$DSH_HOME"

          cat > "$DSH_HOME/settings.yaml" <<EOF
          llm-pi-ai:
            providers:
              openrouter:
                api: openai-completions
                baseURL: ${OPENROUTER_BASE_URL}
                apiKeyEnv: OPENROUTER_API_KEY
                models:
                  - id: '${OPENROUTER_MODEL}'
          agent-default-model:
            provider: openrouter
            model: '${OPENROUTER_MODEL}'
          EOF

          printf 'OPENROUTER_API_KEY=%s\n' "$OPENROUTER_API_KEY" > "$DSH_HOME/.env"
          chmod 600 "$DSH_HOME/.env" "$DSH_HOME/settings.yaml"

      - name: Install Tavily web search provider for DSH
        run: |
          set -euxo pipefail
          dsh plugin --profile headless add "github:1624318455/dsh-plugin-tavily#main"

      - name: Configure Tavily web search
        run: |
          set -euxo pipefail
          PROFILE_DIR="${HOME}/.dsh/profiles/headless"
          mkdir -p "$PROFILE_DIR"

          cat > "$PROFILE_DIR/cordis.patch.yml" <<'EOF'
          - id: web-search-tavily
            name: '@dsh-external/dsh-plugin-tavily'
            config:
              engine: tavily
              topic: news
              searchDepth: advanced
              maxResults: 8
              timeRange: day
              includeAnswer: true
              includeRawContent: false
              timeout: 30000

          - id: web
            config:
              searchProvider: tavily
          EOF

      - name: Generate article with web search
        env:
          ARTICLE_PROMPT: ${{ vars.ARTICLE_PROMPT }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          ARTICLE_DIR: ${{ env.ARTICLE_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "${ARTICLE_DIR}"
          DATE="$(TZ=Asia/Taipei date +%F)"

          {
            printf '%s\n' 'You are an autonomous article publishing agent.'
            printf '%s\n' 'Today in Asia/Taipei: '"${DATE}"
            printf '%s\n' ''
            printf '%s\n' 'USER ARTICLE PROMPT:'
            printf '%s\n' "${ARTICLE_PROMPT}"
            printf '%s\n' ''
            printf '%s\n' 'MANDATORY EXECUTION RULES:'
            printf '%s\n' '1. Use the web_search tool to research the latest information relevant to the user prompt before writing.'
            printf '%s\n' '2. Prefer information published recently and cross-check important claims across multiple sources.'
            printf '%s\n' '3. Write exactly one finished Markdown article into the repository directory content/. Do not only return the article in chat.'
            printf '%s\n' '4. Use a descriptive filename based on the article topic, with lowercase kebab-case and the .md extension. Prefix it with the current date when appropriate, for example content/2026-08-31-example-topic.md.'
            printf '%s\n' '5. Put source links in the article so readers can verify the information.'
            printf '%s\n' '6. Do not modify workflow files, configuration files, or unrelated repository files.'
            printf '%s\n' '7. Before finishing, verify that the Markdown file exists under content/ and contains the complete article.'
          } > /tmp/article-task.txt

          if [ -n "${TAVILY_API_KEY:-}" ]; then
            export TAVILY_API_KEY
          fi

          dsh --profile headless "$(cat /tmp/article-task.txt)"

      - name: Validate generated article
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=("${ARTICLE_DIR}"/*.md)

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No Markdown article was generated in ${ARTICLE_DIR}/"
            exit 1
          fi

          latest="$(ls -1t "${ARTICLE_DIR}"/*.md | head -n 1)"
          echo "Generated article: ${latest}"
          test -s "${latest}"
          head -n 20 "${latest}"

      - name: Configure Git
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "Article Publishing Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

      - name: Commit and push article
        run: |
          set -euo pipefail
          git add "${ARTICLE_DIR}/"

          if git diff --cached --quiet; then
            echo "No new article changes to commit."
            exit 0
          fi

          git commit -m "Publish automated article"
          git push origin HEAD:main

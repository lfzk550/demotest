name: Auto Publish Article

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *'

permissions:
  contents: write

# Required repository secrets:
#   GROK_API_KEY          primary key for https://api.picpi.top/v1
#   OPENROUTER_API_KEY    fallback key for OpenRouter
# Required repository variable:
#   ARTICLE_PROMPT
env:
  GROK_BASE_URL: https://api.picpi.top/v1
  GROK_MODEL: grok-4.6
  OPENROUTER_BASE_URL: https://openrouter.ai/api/v1
  OPENROUTER_MODEL: 'nvidia/nemotron-3-ultra-550b-a55b:free'
  ARTICLE_DIR: content

jobs:
  auto-article:
    name: Generate and publish article
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate article prompt
        env:
          ARTICLE_PROMPT: ${{ vars.ARTICLE_PROMPT }}
        run: |
          set -euo pipefail
          if [ -z "${ARTICLE_PROMPT//[[:space:]]/}" ]; then
            echo "ARTICLE_PROMPT is not configured"
            exit 1
          fi

      - name: Install Node.js
        run: |
          set -euxo pipefail
          curl -fsSL https://deb.nodesource.com/setup_22.x | sudo -E bash -
          sudo apt-get install -y nodejs
          node --version

      - name: Install DeepSeek Harness
        run: npm install -g @deepseek-ai/dsh

      - name: Configure Grok primary and OpenRouter fallback
        env:
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          bash .github/scripts/configure-dsh-providers.sh grok

      - name: Generate article with Grok fallback
        env:
          ARTICLE_PROMPT: ${{ vars.ARTICLE_PROMPT }}
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "${ARTICLE_DIR}"

          cat > /tmp/article-task.txt <<EOF
          You are an autonomous article publishing agent.

          User requirement:
          ${ARTICLE_PROMPT}

          Rules:
          1. Use web_search to collect latest information before writing.
          2. Cross-check important facts.
          3. Write one complete Markdown article into content/.
          4. Filename must be lowercase kebab-case markdown.
          5. Include source links.
          6. Do not modify workflow files.
          EOF

          if dsh --profile headless "$(cat /tmp/article-task.txt)"; then
            echo "Article generated with Grok primary model (${GROK_MODEL})"
          else
            echo "Grok failed, retrying with OpenRouter fallback (${OPENROUTER_MODEL})"
            bash .github/scripts/configure-dsh-providers.sh openrouter
            dsh --profile headless "$(cat /tmp/article-task.txt)"
          fi

      - name: Validate article
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(content/*.md)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No article generated"
            exit 1
          fi
          ls -lh content/

      - name: Commit article
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "Article Publishing Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add content/
          git commit -m "Publish automated article" || exit 0
          git push origin HEAD:main
